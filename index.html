<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Cycle Bottom Signal Tracker</title>
<style>
  :root {
    --bg: #0a0e1a;
    --bg-card: #131827;
    --bg-card-hover: #1a2033;
    --border: #252b3d;
    --text: #e4e7ef;
    --text-dim: #8a93a8;
    --text-muted: #5a6378;
    --accent: #f7931a;
    --green: #22c55e;
    --green-bg: rgba(34, 197, 94, 0.12);
    --amber: #f59e0b;
    --amber-bg: rgba(245, 158, 11, 0.12);
    --red: #ef4444;
    --red-bg: rgba(239, 68, 68, 0.12);
    --gray: #6b7280;
    --gray-bg: rgba(107, 114, 128, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 24px;
    min-height: 100vh;
  }

  .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }

  .container { max-width: 1400px; margin: 0 auto; }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--border);
  }
  .header-title h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .header-title h1 .accent { color: var(--accent); }
  .header-title .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .updated-badge {
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg-card);
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 700;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    color: var(--text);
  }
  .stat-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .stat-value.accent { color: var(--accent); }
  .stat-value.red { color: var(--red); }

  /* Verdict banner */
  .verdict {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-radius: 12px;
    margin-bottom: 24px;
    border: 1px solid var(--border);
    background: var(--bg-card);
  }
  .verdict.continue-dca { border-color: var(--amber); background: linear-gradient(90deg, var(--amber-bg), var(--bg-card)); }
  .verdict.prepare { border-color: var(--accent); background: linear-gradient(90deg, rgba(247, 147, 26, 0.15), var(--bg-card)); }
  .verdict.execute { border-color: var(--green); background: linear-gradient(90deg, var(--green-bg), var(--bg-card)); }

  .verdict-left h2 {
    font-size: 14px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .verdict-action {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .verdict.continue-dca .verdict-action { color: var(--amber); }
  .verdict.prepare .verdict-action { color: var(--accent); }
  .verdict.execute .verdict-action { color: var(--green); }

  .verdict-right {
    text-align: right;
  }
  .verdict-count {
    font-size: 36px;
    font-weight: 800;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    line-height: 1;
  }
  .verdict-count .total { color: var(--text-muted); font-size: 24px; }
  .verdict-count-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Signal cards */
  .section-title {
    font-size: 14px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .signals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .signal-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    transition: border-color 0.2s, transform 0.2s;
  }
  .signal-card:hover {
    background: var(--bg-card-hover);
  }
  .signal-card.triggered { border-left: 4px solid var(--green); }
  .signal-card.partial { border-left: 4px solid var(--amber); }
  .signal-card.pending { border-left: 4px solid var(--gray); }

  .signal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    gap: 12px;
  }
  .signal-number {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .signal-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }
  .signal-title-cn {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .signal-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .signal-badge.triggered { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
  .signal-badge.partial { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber); }
  .signal-badge.pending { background: var(--gray-bg); color: var(--gray); border: 1px solid var(--gray); }

  .signal-weight {
    font-size: 10px;
    color: var(--text-muted);
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  .signal-field {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .signal-field:first-of-type {
    border-top: none;
    padding-top: 0;
    margin-top: 0;
  }
  .field-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .field-label-icon {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .field-label-icon.current { background: var(--text-dim); }
  .field-label-icon.trigger { background: var(--green); }
  .field-label-icon.gap { background: var(--amber); }
  .field-label-icon.level { background: var(--accent); }

  .field-value {
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
  }
  .field-value.gap { color: #fcd34d; }
  .field-value.level { font-family: "SF Mono", Menlo, Consolas, monospace; color: var(--accent); font-size: 12px; }
  .historical {
    font-size: 11px;
    color: var(--text-muted);
    font-style: italic;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }

  /* Bottom sections */
  .bottom-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .bottom-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .bottom-card h3 {
    font-size: 14px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
    font-weight: 600;
  }

  /* DCA */
  .dca-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .dca-stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .dca-stat-num {
    font-size: 24px;
    font-weight: 800;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    color: var(--accent);
  }
  .dca-stat-label {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .progress-bar {
    height: 10px;
    background: var(--border);
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #fbbf24);
    transition: width 0.3s;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
  }
  .this-week {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  /* Leverage gauge */
  .gauge-container { text-align: center; }
  .gauge-num {
    font-size: 44px;
    font-weight: 800;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    line-height: 1;
  }
  .gauge-num .total { color: var(--text-muted); font-size: 28px; }
  .gauge-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
    margin-bottom: 14px;
  }
  .gauge-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .gauge-dot {
    width: 24px;
    height: 10px;
    border-radius: 3px;
    background: var(--border);
  }
  .gauge-dot.active { background: var(--green); }
  .gauge-dot.partial { background: var(--amber); }
  .leverage-params {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.7;
    text-align: left;
  }
  .leverage-params .k { color: var(--text-dim); }
  .leverage-params .v { color: var(--text); font-family: "SF Mono", Menlo, Consolas, monospace; }

  /* Events */
  .event-item {
    padding: 10px 0;
    border-bottom: 1px dashed var(--border);
  }
  .event-item:last-child { border-bottom: none; }
  .event-date {
    font-size: 11px;
    color: var(--accent);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    margin-bottom: 2px;
  }
  .event-name {
    font-size: 13px;
    color: var(--text);
    font-weight: 600;
  }
  .event-impact {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
    line-height: 1.4;
  }

  /* Legend */
  .legend {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--text-muted);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }

  /* Responsive */
  @media (max-width: 1024px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .bottom-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    body { padding: 12px; }
    .stats-grid { grid-template-columns: 1fr; }
    .signals-grid { grid-template-columns: 1fr; }
    .header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .verdict { flex-direction: column; align-items: flex-start; gap: 14px; }
    .verdict-right { text-align: left; }
  }

  /* Print */
  @media print {
    body { background: white; color: black; padding: 10mm; }
    .signal-card, .stat-card, .bottom-card, .verdict, .updated-badge {
      background: white !important;
      border: 1px solid #ccc !important;
      break-inside: avoid;
    }
    .signals-grid { grid-template-columns: repeat(2, 1fr); }
  }
  /* Language toggle */
  .lang-toggle {
    display: inline-flex;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px;
    gap: 2px;
  }
  .lang-btn {
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    border-radius: 4px;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .lang-btn:hover { color: var(--text); }
  .lang-btn.active {
    background: var(--accent);
    color: #0a0e1a;
  }
  .header-right { display: flex; gap: 10px; align-items: center; }

  /* Strategy card */
  .strategy-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: -8px;
    margin-bottom: 14px;
  }
  .strategy-list { display: flex; flex-direction: column; gap: 10px; }
  .strategy-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
  }
  .strategy-row .k {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .strategy-row .v {
    font-size: 12px;
    color: var(--text);
    line-height: 1.4;
  }
  .strategy-note {
    margin-top: 14px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 6px;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* Theory section */
  .theory {
    background: linear-gradient(135deg, rgba(247, 147, 26, 0.06), var(--bg-card));
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .theory-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .theory-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .theory-toggle {
    font-size: 12px;
    color: var(--text-dim);
    transition: transform 0.2s;
  }
  .theory.collapsed .theory-body { display: none; }
  .theory.collapsed .theory-toggle { transform: rotate(-90deg); }
  .theory-body { margin-top: 16px; }
  .theory-block { margin-bottom: 18px; }
  .theory-block:last-child { margin-bottom: 0; }
  .theory-block h4 {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .theory-block p {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.7;
    margin-bottom: 8px;
  }
  .theory-block p:last-child { margin-bottom: 0; }
  .theory-block ul {
    list-style: none;
    padding: 0;
    margin: 6px 0;
  }
  .theory-block li {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.7;
    padding-left: 16px;
    position: relative;
  }
  .theory-block li::before {
    content: "▸";
    position: absolute;
    left: 0;
    color: var(--accent);
  }
  .theory-block strong { color: var(--text); font-weight: 600; }
  .theory-block code {
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 12px;
    color: var(--accent);
  }

</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <h1><span class="accent">₿</span>TC Cycle Bottom Signal Tracker</h1>
      <div class="subtitle">5-signal framework · Daily status monitor · <span id="cycle-pos"></span></div>
    </div>
    <div class="header-right">
      <div class="lang-toggle" role="tablist">
        <button class="lang-btn" data-lang="cn" id="lang-cn">中文</button>
        <button class="lang-btn" data-lang="en" id="lang-en">EN</button>
      </div>
      <div class="updated-badge"><span id="updated-label">Updated</span> <span id="updated"></span></div>
    </div>
  </div>

  <!-- Theory / About section -->
  <div class="theory" id="theory">
    <div class="theory-header" onclick="document.getElementById('theory').classList.toggle('collapsed')">
      <div class="theory-title" id="theory-title"></div>
      <div class="theory-toggle">▼</div>
    </div>
    <div class="theory-body" id="theory-body"></div>
  </div>

  <!-- Top stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label" data-i18n="stat_price"></div>
      <div class="stat-value accent mono" id="btc-price"></div>
      <div class="stat-sub" id="btc-price-sub"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label" data-i18n="stat_drawdown"></div>
      <div class="stat-value red mono" id="drawdown"></div>
      <div class="stat-sub" id="ath-sub"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label" data-i18n="stat_days"></div>
      <div class="stat-value mono" id="days-from-top"></div>
      <div class="stat-sub"><span data-i18n="stat_top_on"></span> <span id="ath-date"></span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label" data-i18n="stat_progress"></div>
      <div class="stat-value mono" id="cycle-progress"></div>
      <div class="stat-sub" id="cycle-progress-sub"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label" data-i18n="stat_bottom"></div>
      <div class="stat-value mono" style="font-size: 16px;" id="bottom-window"></div>
      <div class="stat-sub" id="bottom-price"></div>
    </div>
  </div>

  <!-- Verdict banner -->
  <div class="verdict" id="verdict-banner">
    <div class="verdict-left">
      <h2 data-i18n="verdict_title"></h2>
      <div class="verdict-action" id="verdict-action"></div>
      <div style="font-size: 12px; color: var(--text-dim); margin-top: 6px;" id="verdict-detail"></div>
    </div>
    <div class="verdict-right">
      <div class="verdict-count"><span id="triggered-count">0</span><span class="total">/5</span></div>
      <div class="verdict-count-label" data-i18n="verdict_count_label"></div>
    </div>
  </div>

  <!-- Signal cards -->
  <div class="section-title" data-i18n="signals_title"></div>
  <div class="signals-grid" id="signals"></div>

  <!-- Bottom grid: DCA + Leverage + Events -->
  <div class="bottom-grid">
    <div class="bottom-card">
      <h3 data-i18n="dca_title"></h3>
      <div class="strategy-sub" id="dca-subtitle"></div>
      <div class="strategy-list" id="strategy-list"></div>
      <div class="strategy-note" id="strategy-note"></div>
    </div>

    <div class="bottom-card">
      <h3 data-i18n="leverage_title"></h3>
      <div class="gauge-container">
        <div class="gauge-num"><span id="lev-count">0</span><span class="total">/<span id="lev-req">4</span></span></div>
        <div class="gauge-label" data-i18n="leverage_req_label"></div>
        <div class="gauge-dots" id="gauge-dots"></div>
      </div>
      <div class="leverage-params" id="leverage-params"></div>
    </div>

    <div class="bottom-card">
      <h3 data-i18n="events_title"></h3>
      <div id="events"></div>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><span class="signal-badge triggered">✓ <span data-i18n="status_triggered"></span></span> <span data-i18n="legend_triggered"></span></div>
    <div class="legend-item"><span class="signal-badge partial">◐ <span data-i18n="status_partial"></span></span> <span data-i18n="legend_partial"></span></div>
    <div class="legend-item"><span class="signal-badge pending">○ <span data-i18n="status_pending"></span></span> <span data-i18n="legend_pending"></span></div>
    <div class="legend-item" style="margin-left: auto;" data-i18n="legend_framework"></div>
  </div>
</div>

<script>
const fmt = {
  usd: n => '$' + n.toLocaleString('en-US'),
  usdK: n => '$' + Math.round(n/1000) + 'K',
  pct: n => (n >= 0 ? '+' : '') + n.toFixed(1) + '%',
};

const STATUS_MAP = {
  triggered: { icon: '✓' },
  partial:   { icon: '◐' },
  pending:   { icon: '○' },
};

const UI_TEXT = {
  cn: {
    subtitle: "5 信号底部框架 · 每日状态监控",
    updated_label: "更新于",
    stat_price: "BTC 价格",
    stat_drawdown: "距 ATH 回撤",
    stat_days: "距顶部天数",
    stat_top_on: "顶部日期:",

                      "en": "Fed funds 3.50–3.75% (hold since Jan); dot plot median 1 cut in 2026; 10Y ~4.24%; Strait of Hormuz pushing oil up" },
      "trigger":    { "cn": "满足任一:(a) Fed 暂停/降息,(b) 10Y 连续 2 个月下行,(c) 全球 M2 增速筑底回升",
                      "en": "Any of: (a) Fed pause/cut, (b) 10Y trending down for 2+ months, (c) global M2 growth bottoms and rises" },
      "gap":        { "cn": "短期 Fed 不会降息。需等 10Y 跌破 4.0% 并持续,或 4/29 FOMC 释放鸽派信号,或油价回落缓解通胀压力。",
                      "en": "Fed won't cut near-term. Need 10Y to break below 4.00% and stay, or dovish 4/29 FOMC, or oil pullback easing inflation." },
      "key_level":  { "cn": "Fed funds < 3.50% / 10Y < 4.00% / M2 YoY 转正",
                      "en": "Fed funds < 3.50% / 10Y < 4.00% / M2 YoY turns positive" },
      "historical": { "cn": "2019/1 Fed 暂停 → BTC 同月见底;2022/10 10Y 见顶 → BTC 一个月后见底",
                      "en": "2019/1 Fed pause → BTC bottomed same month; 2022/10 10Y peaked → BTC bottomed 1 month later" } }
  ],
  "leverage": { "signals_triggered": 0, "signals_required": 4, "target_leverage": "1.10x – 1.15x",
    "max_borrow_rate": "12% APR", "liquidation_buffer": ">85% below entry" },
  "events_next_week": [
    { "date": "2026-04-28 ~ 04-29",
      "name":   { "cn": "FOMC 会议 + 鲍威尔发布会", "en": "FOMC Meeting + Powell Press Conference" },
      "impact": { "cn": "影响 Signal 5 —— 鸽派基调利好,鹰派将推后降息预期",
                  "en": "Affects Signal 5 — dovish tone bullish; hawkish pushes back cut expectations" } },
    { "date": "2026-04-30",
      "name":   { "cn": "美国 3 月核心 PCE", "en": "US March Core PCE" },
      "impact": { "cn": "影响 Signal 5 —— 核心 PCE 粘滞则 Fed 降息预期后延",
                  "en": "Affects Signal 5 — sticky core PCE delays cut expectations" } },
    { "date": "Ongoing",
      "name":   { "cn": "中东 / 霍尔木兹海峡", "en": "Middle East / Strait of Hormuz" },
      "impact": { "cn": "油价破 $95 将压制风险资产,复杂化 Fed 路径",
                  "en": "Oil above $95 pressures risk assets, complicates Fed path" } },
    { "date": "Weekly",
      "name":   { "cn": "美国现货 BTC ETF 日度资金流", "en": "US Spot BTC ETF Daily Flows" },
      "impact": { "cn": "Signal 4 需下周继续净流入凑齐 2 连阳",
                  "en": "Signal 4 needs next week's inflows to stack 2 consecutive weeks" } }
  ]
};

// i18n helpers
let currentLang = localStorage.getItem('lang') || 'cn';
let currentData = null;

const tr = (field, lang = currentLang) => {
  if (field == null) return '';
  if (typeof field === 'string' || typeof field === 'number') return field;
  return field[lang] ?? field.cn ?? field.en ?? '';
};

function applyStaticI18n() {
  const T = UI_TEXT[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (T[key] != null) el.textContent = T[key];
  });
  document.getElementById('updated-label').textContent = T.updated_label;
  document.querySelector('.subtitle').innerHTML =
    `${T.subtitle} · <span id="cycle-pos"></span>`;
  document.getElementById('theory-title').textContent = T.theory_title;
  document.getElementById('theory-body').innerHTML = T.theory_body;
  document.getElementById('lang-cn').classList.toggle('active', currentLang === 'cn');
  document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
}

async function load() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    if (!res.ok) throw new Error('fetch failed');
    currentData = await res.json();
  } catch (e) {
    currentData = INLINE_DATA;
  }
  applyStaticI18n();
  render(currentData);
}

function render(d) {
  const T = UI_TEXT[currentLang];

  // Header
  document.getElementById('updated').textContent = d.updated;
  document.getElementById('cycle-pos').textContent =
    T.cycle_pos(d.cycle.days_from_top, tr(d.cycle.expected_bottom_window));

  // Top stats
  document.getElementById('btc-price').textContent = fmt.usd(d.btc.price);
  document.getElementById('btc-price-sub').textContent = T.stat_price_sub(d.btc);

  const dd = (d.btc.price - d.btc.ath) / d.btc.ath * 100;
  document.getElementById('drawdown').textContent = fmt.pct(dd);
  document.getElementById('ath-sub').textContent = T.stat_ath_sub(d.btc.ath);
  document.getElementById('ath-date').textContent = d.btc.ath_date;

  document.getElementById('days-from-top').textContent = d.cycle.days_from_top;
  const cyclePct = Math.min(100, Math.round(d.cycle.days_from_top / d.cycle.top_to_bottom_avg_days * 100));
  document.getElementById('cycle-progress').textContent = cyclePct + '%';
  document.getElementById('cycle-progress-sub').textContent = T.stat_progress_sub(d.cycle.top_to_bottom_avg_days);

  document.getElementById('bottom-window').textContent = tr(d.cycle.expected_bottom_window);
  document.getElementById('bottom-price').textContent = d.cycle.expected_bottom_price_range;

  // Verdict
  const triggered = d.signals.filter(s => s.status === 'triggered').length;
  const partial = d.signals.filter(s => s.status === 'partial').length;
  document.getElementById('triggered-count').textContent = triggered;

  const banner = document.getElementById('verdict-banner');
  const action = document.getElementById('verdict-action');
  const detail = document.getElementById('verdict-detail');
  banner.classList.remove('continue-dca', 'prepare', 'execute');

  if (triggered >= 4) {
    banner.classList.add('execute');
    action.textContent = T.verdict_execute;
    detail.textContent = T.verdict_execute_detail(d.leverage);
  } else if (triggered >= 2 || (triggered + partial) >= 4) {
    banner.classList.add('prepare');
    action.textContent = T.verdict_prepare;
    detail.textContent = T.verdict_prepare_detail(triggered, partial);
  } else {
    banner.classList.add('continue-dca');
    action.textContent = T.verdict_dca;
    detail.textContent = T.verdict_dca_detail(triggered, partial, 5 - triggered - partial);
  }

  // Signal cards
  document.getElementById('signals').innerHTML = d.signals.map(s => `
    <div class="signal-card ${s.status}">
      <div class="signal-header">
        <div>
          <div class="signal-number">${T.signal_label(s.id, s.weight)}</div>
          <div class="signal-title">${tr(s.name)}</div>
          <div class="signal-title-cn">${tr(s.sub)}</div>
        </div>
        <span class="signal-badge ${s.status}">${STATUS_MAP[s.status].icon} ${T['status_' + s.status]}</span>
      </div>
      <div class="signal-field">
        <div class="field-label"><span class="field-label-icon current"></span>${T.field_current}</div>
        <div class="field-value">${tr(s.current)}</div>
      </div>
      <div class="signal-field">
        <div class="field-label"><span class="field-label-icon trigger"></span>${T.field_trigger}</div>
        <div class="field-value">${tr(s.trigger)}</div>
      </div>
      <div class="signal-field">
        <div class="field-label"><span class="field-label-icon gap"></span>${T.field_gap}</div>
        <div class="field-value gap">${tr(s.gap)}</div>
      </div>
      <div class="signal-field">
        <div class="field-label"><span class="field-label-icon level"></span>${T.field_level}</div>
        <div class="field-value level">${tr(s.key_level)}</div>
      </div>
      <div class="historical">📜 ${tr(s.historical)}</div>
    </div>
  `).join('');

  // DCA Strategy
  document.getElementById('dca-subtitle').textContent = T.dca_subtitle;
  const strategyRows = [
    [T.strategy_base_label, T.strategy_base_value],
    [T.strategy_accel_label, T.strategy_accel_value],
    [T.strategy_window_label, T.strategy_window_value],
    [T.strategy_gate_label, T.strategy_gate_value],
  ];
  document.getElementById('strategy-list').innerHTML = strategyRows.map(([k, v]) => `
    <div class="strategy-row">
      <span class="k">${k}</span>
      <span class="v">${v}</span>
    </div>
  `).join('');
  document.getElementById('strategy-note').textContent = T.strategy_note;

  // Leverage
  document.getElementById('lev-count').textContent = triggered;
  document.getElementById('lev-req').textContent = d.leverage.signals_required;
  const gaugeDots = document.getElementById('gauge-dots');
  gaugeDots.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const dot = document.createElement('div');
    dot.className = 'gauge-dot';
    if (i < triggered) dot.classList.add('active');
    else if (i < triggered + partial) dot.classList.add('partial');
    gaugeDots.appendChild(dot);
  }
  document.getElementById('leverage-params').innerHTML = T.leverage_params(d.leverage);

  // Events
  document.getElementById('events').innerHTML = d.events_next_week.map(e => `
    <div class="event-item">
      <div class="event-date">${e.date}</div>
      <div class="event-name">${tr(e.name)}</div>
      <div class="event-impact">${tr(e.impact)}</div>
    </div>
  `).join('');
}

// Language toggle
document.getElementById('lang-cn').addEventListener('click', () => setLang('cn'));
document.getElementById('lang-en').addEventListener('click', () => setLang('en'));
function setLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang === 'cn' ? 'zh-CN' : 'en';
  applyStaticI18n();
  if (currentData) render(currentData);
}

load();
</script>
</body>
</html>
